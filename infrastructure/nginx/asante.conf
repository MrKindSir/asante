map $http_x_forwarded_proto $asante_forward_proto {
    default $scheme;
    https https;
    http http;
}

server {
    # Allow the API's 500 MiB video limit plus request overhead.
    client_max_body_size 512m;
    client_body_buffer_size 128k;
    listen 80;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $asante_upstream asante:3000;
    set $dashboard_upstream dashboard:3001;
    set $api_upstream api:8000;

    location = / {
        return 302 /asante/;
    }

    location = /asante {
        return 302 /asante/;
    }

    location = /asante/review {
        return 302 /asante/review/;
    }

    location /asante/api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
        rewrite ^/asante/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $asante_forward_proto;
        proxy_set_header X-Forwarded-Prefix /asante/api;
    }

    # Internal reviewer dashboard is a separate Next app under its configured basePath.
    location /asante/review/ {
        proxy_pass http://$dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $asante_forward_proto;
        proxy_set_header X-Forwarded-Prefix /asante;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /asante/ {
        proxy_pass http://$asante_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $asante_forward_proto;
        proxy_set_header X-Forwarded-Prefix /asante;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
